name: test-catalog

# Least privilege: `migrate` gets only the database settings.
x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set in .env}

x-backend-env: &backend-env
  <<: *db-env
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:?set in .env}
  MINIO_ENDPOINT_URL: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
  MINIO_BUCKET: ${MINIO_BUCKET:?set in .env}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
  MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}

x-telegram-env: &telegram-env
  BOT_TOKEN: ${BOT_TOKEN:?set in .env}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set in .env}
  WEBAPP_URL: ${WEBAPP_URL:?set in .env}
  ADMIN_IDS: ${ADMIN_IDS:-}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      # Postgres 18+ keeps PGDATA under /var/lib/postgresql/<major>/docker
      - pg_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # Official minio/* images are no longer published; pgsty builds from upstream source.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: creates the images bucket with anonymous read. Idempotent.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"

  # One-shot: applies Alembic migrations. App replicas never migrate on startup.
  migrate:
    build: ./backend
    image: test-catalog-backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    image: test-catalog-backend
    restart: unless-stopped
    environment: *backend-env
    deploy:
      replicas: 2
    # No host ports: reachable only through Caddy (/api/*).
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Single entry point: /api/* -> backend replicas, /media/* -> MinIO bucket (read-only).
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:?set in .env}
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  bot:
    build: ./bot
    image: test-catalog-bot
    restart: unless-stopped
    environment:
      <<: *telegram-env
      # Through Caddy, so requests are balanced across backend replicas.
      BACKEND_URL: http://caddy/api
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    deploy:
      replicas: 2
    # No host ports: Telegram reaches it through Caddy (/tg/webhook).
    # Caddy doesn't depend on bot: `dynamic a` resolves replicas lazily (no cycle).
    depends_on:
      caddy:
        condition: service_healthy

  # One-shot: set_webhook, commands, menu button. Idempotent. Replicas never touch the webhook.
  bot-setup:
    build: ./bot
    image: test-catalog-bot
    restart: "no"
    command: ["python", "-m", "app.setup"]
    environment:
      <<: *telegram-env
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in .env}
    # Turn the webhook on only once replicas can take updates.
    depends_on:
      bot:
        condition: service_healthy

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
