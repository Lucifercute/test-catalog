# Local development only. Compose merges this file into compose.yaml automatically;
# the server sets COMPOSE_FILE=compose.yaml in its .env, so none of these ports exist there.
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  minio:
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  caddy:
    # !override replaces the base 80/443 list instead of appending to it.
    ports: !override
      - "${CADDY_HTTP_PORT:-8080}:80"
